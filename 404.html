<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 • Page Not Found | ApexSMP</title>
    <link rel="icon" type="image/png" href="https://cdn.craftingstore.net/rPPmDHlLQ1/a5bd12907eca98c006d6e821e2c1163b/pure8rccxzledla8lbgk.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #181a26 url('https://i.postimg.cc/vg4q6Sbs/background1.png') center/cover no-repeat fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: rgba(32, 35, 51, 0.94);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #0096c7;
            border-radius: 18px;
            max-width: 480px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
        }
        img { height: 64px; margin-bottom: 16px; }
        .code {
            font-size: 64px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #38bdf8, #0096c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        h1 { font-size: 22px; font-weight: 900; margin-bottom: 10px; }
        p { color: #cfd4e6; font-size: 15px; line-height: 1.5; margin-bottom: 26px; }
        a {
            display: inline-block;
            background: linear-gradient(135deg, #0096c7 0%, #023e8a 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            transition: filter 0.2s ease, transform 0.2s ease;
        }
        a:hover { filter: brightness(1.12); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://cdn.craftingstore.net/rPPmDHlLQ1/a5bd12907eca98c006d6e821e2c1163b/pure8rccxzledla8lbgk.png" alt="ApexSMP">
        <div class="code">404</div>
        <h1>Lost in the End?</h1>
        <p>The page you are looking for doesn’t exist or has been moved.</p>
        <a href="/">← Back to ApexSMP</a>
    </div>
</body>
</html>
